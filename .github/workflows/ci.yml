name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag in the comment) -- see
# publish.yml for the rationale.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Lint/type-checks are platform-independent; run them once on Linux.
      - name: Ruff
        if: runner.os == 'Linux'
        run: ruff check .
      - name: Pylint
        if: runner.os == 'Linux'
        run: pylint httpx_pki --fail-under=9.9
      - name: Mypy
        if: runner.os == 'Linux'
        run: mypy httpx_pki
      # Run the suite on all three OSes. The platform store tests are opted in
      # per runner so a developer's own machine is never touched implicitly:
      # macOS provisions a throwaway keychain, and Windows imports a throwaway
      # certificate into CurrentUser\MY and removes it again -- between them
      # the Security-framework and crypt32 paths run end to end.
      - name: Pytest (coverage)
        env:
          HTTPX_PKI_KEYCHAIN_TESTS: ${{ runner.os == 'macOS' && '1' || '' }}
          HTTPX_PKI_WINSTORE_TESTS: ${{ runner.os == 'Windows' && '1' || '' }}
        run: pytest -q --cov=httpx_pki --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      # Upload from a single representative job: the platform-specific winstore
      # code is pragma-excluded, so every matrix cell reports the same lines --
      # one upload keeps the Codecov number stable and avoids 8x merges.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  # The httpx2 backend legs. The main matrix runs on httpx (the required
  # dependency); these two legs cover the other environments the resolver in
  # httpx_pki/_compat.py can land in: httpx2 alongside httpx (httpx2 wins by
  # preference) and httpx2 alone (the fallback import path never fires).
  # Ubuntu-only at the Python bounds -- the backend resolution is platform-
  # independent, and the platform-store code paths are covered above.
  test-httpx2:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        backend-env: [with-httpx, httpx2-only]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,httpx2]"
      # pip cannot install a package whose required dependency is absent, so
      # the httpx2-only environment is made by uninstalling httpx afterwards.
      # `pip check` would now flag the environment; the tests are the point.
      - name: Remove httpx
        if: matrix.backend-env == 'httpx2-only'
        run: pip uninstall -y httpx
      - name: Assert resolved backend
        run: |
          python -c "import httpx_pki, sys; sys.exit(httpx_pki.HTTP_BACKEND != 'httpx2')"
      - name: Pytest
        run: pytest -q --no-cov
